name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker compose build app
      - name: Run the test suite in the image
        run: docker compose --profile test run --rm test
      - name: Dashboard script parses
        run: docker run --rm -v "$PWD/dashboard:/d:ro" lexflow:latest node --check /d/app.js

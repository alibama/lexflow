# Lexipedia pipeline stack: local LLM + metasearch + the pipeline worker.
# GPU: uncomment the deploy block (NVIDIA Container Toolkit) - CPU works but is slow for 27B models.
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_CONTEXT_LENGTH: "32768"     # Ollama's default context is small; extraction needs ~16-32k
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports: ["8080:8080"]
    volumes: ["./searxng:/etc/searxng:rw"]
    environment:
      SEARXNG_BASE_URL: "http://localhost:8080/"
    restart: unless-stopped

  lexflow:
    build: {context: .., dockerfile: docker/Dockerfile}
    depends_on: [ollama, searxng]
    environment:
      OLLAMA_URL: "http://ollama:11434"
      SEARXNG_URL: "http://searxng:8080"
      DOKUWIKI_URL: "https://lexipedia.xyz"          # needs remote=1 + remoteuser=@bots on the wiki
      DOKUWIKI_TOKEN: "${DOKUWIKI_TOKEN:-}"          # bot user's token from its profile page
    volumes: ["../out:/app/out", "../fixtures:/app/fixtures"]
    command: ["python", "scripts/build_all.py"]

  # Optional: conversational editing with the patched bpmn-assistant (Ollama provider)
  # bpmn-assistant:
  #   build: ../../ext/bpmn-assistant          # apply patches/bpmn-assistant-ollama.patch first
  #   environment: {OLLAMA_API_BASE: "http://ollama:11434", OLLAMA_NUM_CTX: "32768"}

volumes:
  ollama: {}
